name: Apply Milliy Sertifikat mock tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_milliy_mock_v2.py'
      - '.github/workflows/add-milliy-mock-v4.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Mock Test patch
        run: python scripts/apply_milliy_mock_v2.py

      - name: Syntax check
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', s, flags=re.S|re.I)
          for i, block in enumerate(blocks):
              f = Path(f'/tmp/script-{i}.js')
              f.write_text(block, encoding='utf-8')
              r = subprocess.run(['node', '--check', str(f)], capture_output=True, text=True)
              if r.returncode != 0:
                  print(r.stderr)
                  raise SystemExit('JS syntax xatosi')

      - name: Verify Mock Test cleanup
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          section = s[s.find('id="panel-mocktest"'):s.find('id="panel-profile"')]
          for bad in ['>Barchasi<','>Algebra<','>Geometriya<']:
              if bad in section:
                  raise SystemExit(f'Eski filter qolib ketgan: {bad}')
          if 'MILLLIY SERTIFIKAT MOCK TEST' in s:
              raise SystemExit('Marker typo')
          if '// ================= MILLIY SERTIFIKAT MOCK TEST =================' not in s:
              raise SystemExit('Yangi Mock Test kodi topilmadi')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply working Milliy Sertifikat mock tests" || exit 0
          git push
