name: Apply Milliy Sertifikat mock tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/replace_mock_official.py'
      - '.github/workflows/add-milliy-mock-v4.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply official-format Mock Test patch
        run: python scripts/replace_mock_official.py

      - name: Syntax check
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', s, flags=re.S|re.I)
          for i, block in enumerate(blocks):
              f = Path(f'/tmp/script-{i}.js')
              f.write_text(block, encoding='utf-8')
              r = subprocess.run(['node', '--check', str(f)], capture_output=True, text=True)
              if r.returncode != 0:
                  print(r.stderr)
                  raise SystemExit('JS syntax xatosi')

      - name: Verify official structure
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = [
              '35 ta yopiq + 10 ta ochiq',
              '55 ta javob elementi',
              "minutes:150",
              "open:[",
          ]
          for x in required:
              if x not in s:
                  raise SystemExit(f'Kutilgan yangi format topilmadi: {x}')
          section_start = s.find('id="panel-mocktest"')
          section_end = s.find('id="panel-profile"', section_start)
          section = s[section_start:section_end] if section_start >= 0 and section_end >= 0 else s
          for bad in ['>Barchasi<','>Algebra<','>Geometriya<']:
              if bad in section:
                  raise SystemExit(f'Eski filter qolib ketgan: {bad}')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use real Milliy sertifikat mock structure" || exit 0
          git push
