name: Apply Milliy Sertifikat mock tests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Mock Test patch
        run: python scripts/apply_milliy_mock.py

      - name: Syntax check
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', s, flags=re.S|re.I)
          for i, block in enumerate(blocks):
              f = Path(f'/tmp/script-{i}.js')
              f.write_text(block, encoding='utf-8')
              r = subprocess.run(['node', '--check', str(f)], capture_output=True, text=True)
              if r.returncode != 0:
                  print(r.stderr)
                  raise SystemExit('JS syntax xatosi')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add working Milliy Sertifikat mock tests" || exit 0
          git push
