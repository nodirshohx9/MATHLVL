name: Add syntax-safe Milliy Sertifikat mock tests

on:
  push:
    paths:
      - '.github/workflows/add-milliy-mock-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Mock Test section safely
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s, n = re.subn(
              r'<div class="mocktest-filter-row" id="mocktest-filter-row">.*?</div>',
              '<div class="mocktest-filter-row" id="mocktest-filter-row">\n      <button class="mt-filter-btn active" data-mt-subject="Milliy sertifikat">Milliy sertifikat</button>\n    </div>',
              s, count=1, flags=re.S
          )
          if n != 1:
              raise SystemExit('Mock filter block topilmadi')

          new_js = r'''// ================= MILLIY SERTIFIKAT MOCK TEST =================
// MATHLVL tomonidan tuzilgan original mock savollar; BBA matematika namunaviy testlari uslubiga mos.
const mockTestData = [
  {
    id:"ms1", title:"Matematika — Milliy sertifikat Mock #1", minutes:90,
    questions:[
      {q:"Agar $3x-7=20$ bo‘lsa, $x$ ni toping.", o:["7","8","9","10"], a:2},
      {q:"$x^2-9x+20=0$ tenglama ildizlari yig‘indisi nechaga teng?", o:["5","9","20","-9"], a:1},
      {q:"$2^x=32$ tenglamaning yechimi?", o:["4","5","6","8"], a:1},
      {q:"Arifmetik progressiyada $a_1=4$, $d=3$. $a_{12}$ ni toping.", o:["34","36","37","40"], a:2},
      {q:"$\\log_2 64$ ning qiymati?", o:["4","5","6","8"], a:2},
      {q:"Tomonlari 9 va 12 bo‘lgan to‘g‘ri to‘rtburchak diagonali?", o:["13","14","15","16"], a:2},
      {q:"Radiusi 5 bo‘lgan doiraning yuzi?", o:["$10\\pi$","$20\\pi$","$25\\pi$","$50\\pi$"], a:2},
      {q:"$|2x-3|=7$ tenglamaning barcha yechimlari yig‘indisi?", o:["1","3","5","7"], a:1},
      {q:"$2x+y=11$, $x-y=1$ sistemada $x$ ni toping.", o:["3","4","5","6"], a:1},
      {q:"$\\sqrt{72}$ ni soddalashtiring.", o:["$3\\sqrt8$","$6\\sqrt2$","$8\\sqrt2$","$12\\sqrt2$"], a:1},
      {q:"$f(x)=x^3-5x$ funksiyaning hosilasi?", o:["$3x^2-5$","$3x^2-5x$","$x^2-5$","$3x-5$"], a:0},
      {q:"$\\int_0^3 2x\\,dx$ ni hisoblang.", o:["6","9","12","18"], a:1},
      {q:"$C_7^2$ ni toping.", o:["14","21","28","35"], a:1},
      {q:"Bir sonning $40\\%$ i 96 ga teng. Sonni toping.", o:["220","230","240","250"], a:2},
      {q:"$\\sin 30^\\circ$ ning qiymati?", o:["$0$","$1/2$","$\\sqrt2/2$","$\\sqrt3/2$"], a:1}
    ]
  },
  {
    id:"ms2", title:"Matematika — Milliy sertifikat Mock #2", minutes:90,
    questions:[
      {q:"$5x+4=29$ tenglamaning yechimi?", o:["4","5","6","7"], a:1},
      {q:"$x^2-5x+6=0$ tenglama ildizlari ko‘paytmasi?", o:["5","6","-5","-6"], a:1},
      {q:"$3^{x+1}=81$ bo‘lsa, $x$?", o:["2","3","4","5"], a:1},
      {q:"Geometrik progressiyada $b_1=2$, $q=3$. $b_5$?", o:["54","108","162","243"], a:2},
      {q:"$\\log_3 81$ ning qiymati?", o:["3","4","5","6"], a:1},
      {q:"Katetlari 5 va 12 bo‘lgan to‘g‘ri burchakli uchburchak gipotenuzasi?", o:["11","12","13","14"], a:2},
      {q:"Tomoni 8 bo‘lgan kvadratning diagonali?", o:["$4\\sqrt2$","$8\\sqrt2$","$16$","$16\\sqrt2$"], a:1},
      {q:"$|3x+1|=10$ tenglama yechimlari yig‘indisi?", o:["$-2/3$","$2/3$","2","-2"], a:0},
      {q:"$x+y=9$, $x-y=3$ sistemada $y$?", o:["2","3","4","6"], a:1},
      {q:"$\\sqrt{98}$ ni soddalashtiring.", o:["$7\\sqrt2$","$14\\sqrt2$","$49\\sqrt2$","$2\\sqrt7$"], a:0},
      {q:"$f(x)=2x^4-x^2$ funksiyaning hosilasi?", o:["$8x^3-2x$","$6x^3-2x$","$8x^3-x$","$2x^3-2x$"], a:0},
      {q:"$\\int_1^3 2\\,dx$ ni hisoblang.", o:["2","4","6","8"], a:1},
      {q:"$C_8^3$ ni toping.", o:["48","56","64","72"], a:1},
      {q:"Narx 200 000 so‘mdan 15% ga arzonlashdi. Yangi narx?", o:["160 000","165 000","170 000","175 000"], a:2},
      {q:"$\\cos 60^\\circ$ ning qiymati?", o:["$0$","$1/2$","$\\sqrt2/2$","$1$"], a:1}
    ]
  },
  {
    id:"ms3", title:"Matematika — Milliy sertifikat Mock #3", minutes:90,
    questions:[
      {q:"$7x-5=30$ bo‘lsa, $x$?", o:["4","5","6","7"], a:1},
      {q:"$x^2-11x+24=0$ ildizlari yig‘indisi?", o:["8","11","24","-11"], a:1},
      {q:"$4^x=64$ bo‘lsa, $x$?", o:["2","3","4","6"], a:1},
      {q:"Arifmetik progressiyada $a_1=10$, $d=-2$. $a_8$?", o:["-4","-2","0","2"], a:0},
      {q:"$\\log_5 125$ ning qiymati?", o:["2","3","4","5"], a:1},
      {q:"Tomonlari 7, 24, 25 bo‘lgan uchburchak qanday uchburchak?", o:["o‘tkir burchakli","to‘g‘ri burchakli","o‘tmas burchakli","teng yonli"], a:1},
      {q:"Radiusi 4 bo‘lgan aylana uzunligi?", o:["$4\\pi$","$8\\pi$","$16\\pi$","$32\\pi$"], a:1},
      {q:"$|x-4|=6$ tenglama yechimlari yig‘indisi?", o:["4","6","8","10"], a:2},
      {q:"$3x+2y=16$, $x-y=2$ sistemada $x$?", o:["2","3","4","5"], a:2},
      {q:"$\\sqrt{200}$ ni soddalashtiring.", o:["$5\\sqrt2$","$10\\sqrt2$","$20\\sqrt2$","$100\\sqrt2$"], a:1},
      {q:"$f(x)=5x^2+3x-1$ funksiyaning hosilasi?", o:["$10x+3$","$5x+3$","$10x-1$","$5x^2+3$"], a:0},
      {q:"$\\int_0^4 x\\,dx$ ni hisoblang.", o:["4","6","8","16"], a:2},
      {q:"$P_5$ nechaga teng?", o:["20","60","120","240"], a:2},
      {q:"120 soni 25% ga oshirilsa nechaga teng bo‘ladi?", o:["135","145","150","155"], a:2},
      {q:"$\\tan 45^\\circ$ ning qiymati?", o:["0","$1/2$","1","$\\sqrt3$"], a:2}
    ]
  }
];

let activeMock=null, mockIndex=0, mockAnswers=[], mockSecondsLeft=0, mockTimerId=null;

function renderMathSafe(el){
  if(!el || typeof renderMathInElement!=="function") return;
  try{ renderMathInElement(el,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}]}); }catch(e){}
}

function renderMockTestList(){
  clearInterval(mockTimerId); mockTimerId=null; activeMock=null;
  const list=document.getElementById("mocktest-list");
  list.innerHTML=mockTestData.map(t=>`<div class="mt-card"><div class="mt-card-icon" style="background:rgba(61,169,252,.14);color:var(--blue);">π</div><div class="mt-card-body"><div class="mt-card-title">${t.title}</div><div class="mt-card-meta">${t.questions.length} ta savol • ${t.minutes} daqiqa</div><div class="mt-card-result">Milliy sertifikat uslubidagi MATHLVL mock</div></div><button class="glow-btn mt-card-start" type="button" data-mt-start="${t.id}">Boshlash</button></div>`).join("");
  list.querySelectorAll("[data-mt-start]").forEach(btn=>btn.addEventListener("click",()=>startMockTest(btn.dataset.mtStart)));
}

function startMockTest(id){
  activeMock=mockTestData.find(t=>t.id===id); if(!activeMock) return;
  mockIndex=0; mockAnswers=Array(activeMock.questions.length).fill(null); mockSecondsLeft=activeMock.minutes*60;
  clearInterval(mockTimerId);
  mockTimerId=setInterval(()=>{ mockSecondsLeft=Math.max(0,mockSecondsLeft-1); updateMockClock(); if(mockSecondsLeft===0) finishMockTest(true); },1000);
  renderMockQuestion();
}

function updateMockClock(){
  const el=document.getElementById("mock-clock"); if(!el) return;
  const m=Math.floor(mockSecondsLeft/60), sec=mockSecondsLeft%60;
  el.textContent=`${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

function renderMockQuestion(){
  if(!activeMock) return;
  const list=document.getElementById("mocktest-list"), q=activeMock.questions[mockIndex], letters=["A","B","C","D"];
  list.innerHTML=`<div class="glass-card" style="padding:20px;"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px;"><div><div style="font-weight:800;">${activeMock.title}</div><div style="font-size:12px;color:var(--text-dim);margin-top:3px;">Savol ${mockIndex+1} / ${activeMock.questions.length}</div></div><div id="mock-clock" style="font-family:var(--font-mono);font-weight:800;color:var(--gold);font-size:16px;"></div></div><div id="mock-question-text" style="font-size:16px;line-height:1.65;font-weight:600;margin:18px 0;"></div><div id="mock-options" style="display:grid;gap:9px;"></div><div id="mock-nav-grid" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;"></div><div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;"><button class="ghost-btn" id="mock-prev" type="button" ${mockIndex===0?"disabled":""}>← Oldingi</button><button class="glow-btn" id="mock-next" type="button">${mockIndex===activeMock.questions.length-1?"Yakunlash":"Keyingi →"}</button><button class="ghost-btn" id="mock-exit" type="button" style="margin-left:auto;">Testdan chiqish</button></div></div>`;
  const qEl=document.getElementById("mock-question-text"); qEl.textContent=q.q; renderMathSafe(qEl);
  const options=document.getElementById("mock-options");
  q.o.forEach((txt,i)=>{ const b=document.createElement("button"); b.type="button"; b.className="ghost-btn"; b.style.textAlign="left"; b.style.width="100%"; if(mockAnswers[mockIndex]===i){b.style.borderColor="var(--blue)";b.style.background="var(--blue-soft)";} const span=document.createElement("span"); span.textContent=`${letters[i]}) ${txt}`; b.appendChild(span); renderMathSafe(span); b.addEventListener("click",()=>{mockAnswers[mockIndex]=i;renderMockQuestion();}); options.appendChild(b); });
  const nav=document.getElementById("mock-nav-grid");
  activeMock.questions.forEach((_,i)=>{ const b=document.createElement("button"); b.type="button"; b.textContent=i+1; b.className="ghost-btn"; b.style.padding="7px 10px"; if(i===mockIndex)b.style.borderColor="var(--gold)"; else if(mockAnswers[i]!==null)b.style.borderColor="var(--blue)"; b.addEventListener("click",()=>{mockIndex=i;renderMockQuestion();}); nav.appendChild(b); });
  document.getElementById("mock-prev").addEventListener("click",()=>{if(mockIndex>0){mockIndex--;renderMockQuestion();}});
  document.getElementById("mock-next").addEventListener("click",()=>{if(mockIndex<activeMock.questions.length-1){mockIndex++;renderMockQuestion();}else finishMockTest(false);});
  document.getElementById("mock-exit").addEventListener("click",()=>{if(confirm("Testdan chiqilsinmi? Hozirgi javoblar saqlanmaydi.")) renderMockTestList();});
  updateMockClock();
}

function finishMockTest(autoFinish){
  if(!activeMock) return;
  clearInterval(mockTimerId); mockTimerId=null;
  let correct=0; activeMock.questions.forEach((q,i)=>{if(mockAnswers[i]===q.a) correct++;});
  const total=activeMock.questions.length, answered=mockAnswers.filter(v=>v!==null).length, percent=Math.round(correct/total*100);
  const result={title:activeMock.title,correct,total,answered,percent,at:new Date().toISOString()};
  try{const history=JSON.parse(localStorage.getItem("mathlvl_mock_results")||"[]");history.unshift(result);localStorage.setItem("mathlvl_mock_results",JSON.stringify(history.slice(0,20)));}catch(e){}
  const list=document.getElementById("mocktest-list");
  list.innerHTML=`<div class="glass-card" style="text-align:center;padding:28px;"><div style="font-size:42px;margin-bottom:8px;">${percent>=70?"🏆":percent>=50?"📈":"📚"}</div><h3 style="font-family:var(--font-display);margin:0 0 8px;">Natija: ${correct} / ${total}</h3><div style="font-size:28px;font-weight:800;color:var(--blue);margin-bottom:8px;">${percent}%</div><div style="color:var(--text-dim);font-size:13px;margin-bottom:20px;">Javob berilgan: ${answered}/${total}${autoFinish?" • Vaqt tugadi":""}</div><button class="glow-btn" id="mock-back-list" type="button">Mock testlarga qaytish</button></div>`;
  document.getElementById("mock-back-list").addEventListener("click",renderMockTestList); activeMock=null;
}

const mockResultsBtn=document.getElementById("mocktest-results-btn");
if(mockResultsBtn){mockResultsBtn.addEventListener("click",()=>{let history=[];try{history=JSON.parse(localStorage.getItem("mathlvl_mock_results")||"[]");}catch(e){} const list=document.getElementById("mocktest-list"); list.innerHTML=`<div class="glass-card" style="padding:20px;"><h3 style="margin-top:0;">Oxirgi natijalar</h3>${history.length?history.map(r=>`<div style="padding:11px 0;border-bottom:1px solid var(--border-soft);"><b>${r.title}</b><div style="font-size:12px;color:var(--text-dim);margin-top:3px;">${r.correct}/${r.total} • ${r.percent}%</div></div>`).join(""):"<div class=\"empty-note\">Hali natija yo‘q.</div>"}<button class="ghost-btn" id="mock-results-back" type="button" style="margin-top:16px;">Orqaga</button></div>`; document.getElementById("mock-results-back").addEventListener("click",renderMockTestList);});}

renderMockTestList();'''

          pattern = r"// ================= MOCK TEST \(namunaviy ma'lumotlar, backend hali yo'q\) =================.*?renderMockTestList\(\);"
          s, n = re.subn(pattern, lambda m:new_js, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Eski Mock Test JS block topilmadi')

          p.write_text(s, encoding='utf-8')

      - name: Syntax-check inline JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,flags=re.S|re.I)
          for i,block in enumerate(blocks):
              f=Path(f'/tmp/mathlvl-inline-{i}.js'); f.write_text(block,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode!=0:
                  print(r.stderr)
                  raise SystemExit(f'JavaScript syntax error in inline script #{i}')
          print(f'Checked {len(blocks)} inline scripts')

      - name: Commit tested Mock Test update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add tested Milliy Sertifikat mock test experience"
          git push
